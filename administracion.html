<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paradisio Entertainment Group · CEO</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F3EE">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F6F3EE;
    --card: #FFFFFF;
    --line: #E7E1D7;
    --line-soft: #F0EBE3;
    --ink: #1A1816;
    --ink-2: #57524B;
    --muted: #8C857B;
    --cost: #BDB5A9;
    --good: #1E8A5A;
    --bad: #C2410C;
    --club: #D93A1F;
    --beats: #2A78D6;
    --icon: #E39B00;
    --accent: var(--club);
    --radius: 18px;
    --shadow: 0 1px 2px rgba(26,24,22,.04), 0 8px 24px rgba(26,24,22,.05);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .serif { font-family: 'Fraunces', Georgia, serif; font-weight: 500; letter-spacing: -.01em; margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Login ---------- */
  #login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card { width: min(400px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 40px 32px 32px; box-shadow: var(--shadow); text-align: center; animation: rise .8s cubic-bezier(.16,.84,.3,1) both; }
  .login-card img { width: 190px; margin: 0 auto 8px; display: block; }
  .login-card p { color: var(--muted); margin: 6px 0 24px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
  .login-card input { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 15px; outline: none; transition: border-color .2s; }
  .login-card input:focus { border-color: var(--ink); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--ink); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; font-weight: 500; cursor: pointer; transition: transform .15s, opacity .2s; }
  .btn:hover { transform: translateY(-1px); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.small { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
  .login-card .btn { width: 100%; margin-top: 12px; padding: 14px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 10px; }

  /* ---------- App shell ---------- */
  #app { display: none; }
  header.top { position: sticky; top: 0; z-index: 20; background: rgba(246,243,238,.86); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
  .top-inner { max-width: 1320px; margin: 0 auto; padding: 14px 28px; display: flex; align-items: center; gap: 24px; }
  .brandmark { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brandmark img { height: 34px; width: auto; }
  .brandmark .co { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
  .brandmark .co b { display: block; font-weight: 600; color: var(--ink); letter-spacing: .14em; }
  nav.tabs { display: flex; gap: 4px; background: #EFEAE2; padding: 4px; border-radius: 14px; margin-left: auto; overflow-x: auto; }
  nav.tabs button { border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; cursor: pointer; color: var(--ink-2); font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 8px; transition: background .2s, color .2s; }
  nav.tabs button .dot { width: 8px; height: 8px; border-radius: 50%; }
  nav.tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(26,24,22,.08); }
  .top-tools { display: flex; align-items: center; gap: 10px; }
  .switch { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap; }
  .switch input { display: none; }
  .switch .knob { width: 34px; height: 20px; background: #DCD5CA; border-radius: 20px; position: relative; transition: background .2s; }
  .switch .knob::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .switch input:checked + .knob { background: var(--ink); }
  .switch input:checked + .knob::after { transform: translateX(14px); }
  .icon-btn { border: 1px solid var(--line); background: var(--card); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; }
  .icon-btn svg { width: 16px; height: 16px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }

  main { max-width: 1320px; margin: 0 auto; padding: 28px 28px 80px; }
  .page { display: none; }
  .page.on { display: block; animation: fade .5s ease both; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; flex-wrap: wrap; }
  .hero h1 { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.05; }
  .hero .sub { color: var(--muted); margin-top: 6px; }
  .stamp { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(30,138,90,.5); animation: pulse 2s infinite; }

  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(5, minmax(0,1fr)); margin-bottom: 16px; }
  .kpis.four { grid-template-columns: repeat(4, minmax(0,1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; animation: rise .7s cubic-bezier(.16,.84,.3,1) both; }
  .card h3 { font-size: 17px; }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .kpi .label { color: var(--ink-2); font-size: 12px; letter-spacing: .04em; }
  .kpi .value { font-family: 'Fraunces', Georgia, serif; font-size: clamp(24px, 2.3vw, 32px); margin-top: 8px; line-height: 1; white-space: nowrap; }
  .kpi .foot { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .kpi .bar { height: 3px; border-radius: 3px; background: var(--line-soft); margin-top: 14px; overflow: hidden; }
  .kpi .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width 1.4s cubic-bezier(.16,.84,.3,1); }
  .pos { color: var(--good); }
  .neg { color: var(--bad); }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: .04em; padding: 3px 9px; border-radius: 20px; background: var(--line-soft); color: var(--ink-2); white-space: nowrap; }
  .tag .dot, .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .tag.realizado { background: #E3F1E9; color: #166544; }
  .tag.presupuesto { background: #FBEBD8; color: #8A4B0C; }
  .tag.confirmado { background: #E2ECFA; color: #1D4F94; }
  .tag.planificación { background: #EFEAE2; color: var(--ink-2); }

  .two { grid-template-columns: 1.55fr 1fr; }
  .halves { grid-template-columns: 1fr 1fr; }
  .thirds { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .chart-box { position: relative; height: 280px; }
  .chart-box.tall { height: 340px; }
  .chart-box.short { height: 220px; }
  .row-gap { margin-top: 16px; }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .timeline { display: flex; flex-direction: column; gap: 10px; }
  .tl-item { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px; border: 1px solid var(--line-soft); border-radius: 14px; cursor: pointer; transition: border-color .2s, transform .2s; }
  .tl-item:hover { border-color: var(--line); transform: translateX(2px); }
  .tl-date { text-align: center; border-radius: 12px; padding: 8px 0; color: #fff; }
  .tl-date b { display: block; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; line-height: 1; }
  .tl-date small { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
  .tl-name { font-weight: 600; }
  .tl-meta { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .tl-right { text-align: right; }
  .tl-right .serif { font-size: 18px; }

  .brand-cards { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .brand-card { cursor: pointer; position: relative; overflow: hidden; transition: transform .25s, box-shadow .25s; }
  .brand-card:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(26,24,22,.05), 0 16px 32px rgba(26,24,22,.08); }
  .brand-card::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: var(--c); }
  .brand-card h3 { font-size: 22px; margin-top: 4px; }
  .brand-card .tagline { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .mini-stats div { border-top: 1px solid var(--line-soft); padding-top: 10px; }
  .mini-stats small { color: var(--muted); font-size: 11px; display: block; }
  .mini-stats b { font-family: 'Fraunces', serif; font-weight: 500; font-size: 19px; }

  /* Brand page */
  .brand-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; flex-wrap: wrap; }
  .brand-hero .swatch { width: 54px; height: 54px; border-radius: 16px; background: var(--accent); display: grid; place-items: center; color: #fff; font-family: 'Fraunces', serif; font-size: 24px; }
  .brand-hero h1 { font-size: clamp(28px, 3vw, 38px); }
  .brand-hero .sub { color: var(--muted); margin-top: 4px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .pill { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; transition: border-color .2s, box-shadow .2s; min-width: 150px; }
  .pill small { color: var(--muted); font-size: 11px; }
  .pill.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .section-title { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 14px; }
  .section-title h2 { font-size: 22px; }
  .section-title span { color: var(--muted); font-size: 12px; }

  .funnel { display: flex; flex-direction: column; gap: 14px; }
  .funnel-row .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .funnel-row .top b { font-family: 'Fraunces', serif; font-weight: 500; font-size: 18px; }
  .funnel-row .track { height: 12px; background: var(--line-soft); border-radius: 6px; overflow: hidden; }
  .funnel-row .track i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--accent); transition: width 1.4s cubic-bezier(.16,.84,.3,1); }
  .funnel-row small { color: var(--muted); font-size: 11px; }

  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 8px 8px; border-bottom: 1px solid var(--line); }
  table.t td { padding: 9px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  table.t td.r, table.t th.r { text-align: right; }
  table.t tr.total td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--line); }
  .bar-cell { display: flex; align-items: center; gap: 10px; }
  .bar-cell .mini { flex: 1; height: 6px; background: var(--line-soft); border-radius: 4px; overflow: hidden; min-width: 50px; }
  .bar-cell .mini i { display: block; height: 100%; background: var(--accent); border-radius: 4px; width: 0; transition: width 1.2s cubic-bezier(.16,.84,.3,1); }
  .progress { display: flex; flex-direction: column; gap: 12px; }
  .progress .p-row .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
  .progress .track { height: 8px; background: var(--line-soft); border-radius: 5px; overflow: hidden; position: relative; }
  .progress .track i { display: block; height: 100%; border-radius: 5px; width: 0; transition: width 1.3s cubic-bezier(.16,.84,.3,1); }

  .empty { text-align: center; padding: 46px 24px; }
  .empty .big { font-family: 'Fraunces', serif; font-size: 24px; margin-bottom: 8px; }
  .empty p { color: var(--muted); max-width: 460px; margin: 0 auto 18px; line-height: 1.5; }
  .checklist { text-align: left; max-width: 420px; margin: 0 auto 22px; display: grid; gap: 8px; }
  .checklist div { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-2); }
  .note { background: #FBF8F3; border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 14px; color: var(--ink-2); line-height: 1.5; font-size: 13px; }

  /* Editor */
  .editor { grid-template-columns: 300px 1fr; align-items: start; }
  .ev-list { display: flex; flex-direction: column; gap: 6px; }
  .ev-list .grp { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 12px 0 4px; display: flex; align-items: center; gap: 6px; }
  .ev-list button { text-align: left; border: 1px solid transparent; background: transparent; padding: 10px 12px; border-radius: 10px; cursor: pointer; }
  .ev-list button small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .ev-list button.on { background: var(--bg); border-color: var(--line); }
  .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
  .form-grid label, .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-2); }
  .form-grid .wide { grid-column: 1 / -1; }
  input.in, select.in, textarea.in { border: 1px solid var(--line); background: #FDFCFA; border-radius: 10px; padding: 9px 11px; font-size: 14px; outline: none; width: 100%; transition: border-color .2s; }
  input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--ink); }
  textarea.in { min-height: 70px; resize: vertical; }
  .lines { margin-top: 22px; }
  .lines h3 { font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
  .line-row { display: grid; grid-template-columns: 1fr 180px 130px 34px; gap: 8px; margin-top: 8px; }
  .line-row input.amt { text-align: right; }
  .del { border: 1px solid var(--line); background: transparent; border-radius: 10px; cursor: pointer; color: var(--muted); }
  .del:hover { color: var(--bad); border-color: var(--bad); }
  .save-bar { position: sticky; bottom: 16px; margin-top: 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--ink); color: #fff; padding: 12px 14px 12px 18px; border-radius: 14px; box-shadow: 0 10px 30px rgba(26,24,22,.2); }
  .save-bar .btn { background: #fff; color: var(--ink); border-color: #fff; }
  .save-bar .btn.ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.3); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; opacity: 0; transition: all .3s; z-index: 50; pointer-events: none; }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  .warn-banner { background: #FBEBD8; color: #7A420B; border: 1px solid #F2D3AE; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(30,138,90,.45); } 70% { box-shadow: 0 0 0 8px rgba(30,138,90,0); } 100% { box-shadow: 0 0 0 0 rgba(30,138,90,0); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .two, .halves, .thirds, .brand-cards, .editor { grid-template-columns: 1fr; }
    .top-inner { flex-wrap: wrap; }
    nav.tabs { margin-left: 0; order: 3; width: 100%; }
  }
  @media (max-width: 640px) {
    main { padding: 18px 14px 60px; }
    .top-inner { padding: 12px 14px; gap: 12px; }
    .kpis, .kpis.four { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .line-row { grid-template-columns: 1fr 100px 34px; }
    .line-row .cat { grid-column: 1 / -1; order: 3; }
    .brandmark .co { display: none; }
  }
</style>
</head>
<body>

<section id="login">
  <form class="login-card" id="login-form" autocomplete="off">
    <img src="/paradisio-logo.png" alt="Paradisio">
    <p>Entertainment Group · CEO</p>
    <input type="password" id="pass" placeholder="Clave de CEO" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
    <div class="err" id="login-err"></div>
  </form>
</section>

<div id="app">
  <header class="top">
    <div class="top-inner">
      <div class="brandmark">
        <img src="/paradisio-logo.png" alt="Paradisio">
        <div class="co"><b>Entertainment Group</b>Dashboard de CEO</div>
      </div>
      <nav class="tabs" id="tabs"></nav>
      <div class="top-tools">
        <label class="switch" title="Incluir IGV y renta en los costos">
          <input type="checkbox" id="tax-toggle" checked><span class="knob"></span><span>Con impuestos</span>
        </label>
        <button class="icon-btn" id="refresh" title="Actualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ---------- Estado ----------
  var PASS = '';
  var DATA = null;      // { finance, live, ... }
  var TAB = 'group';
  var SEL = {};         // evento elegido por marca
  var EDIT_ID = null;   // evento abierto en el editor
  var DRAFT = null;     // copia editable de finance
  var DIRTY = false;
  var charts = [];
  var refreshTimer = null;

  var CATEGORIES = ['Local', 'Talento', 'Personal', 'Barra', 'Promotores', 'Producción', 'Marketing', 'Comisiones', 'Impuestos', 'Boxes y mesas', 'Entradas', 'Otros'];
  var STATUSES = ['planificación', 'confirmado', 'presupuesto', 'realizado'];
  var MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];

  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }

  // ---------- Utilidades ----------
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n, dec) {
    var v = Number(n) || 0;
    var s = Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: dec || 0, maximumFractionDigits: dec || 0 });
    return (v < 0 ? '−' : '') + 'S/ ' + s;
  }
  function short(n) {
    var v = Number(n) || 0, a = Math.abs(v);
    var s = a >= 1000 ? (a / 1000).toFixed(a >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k' : Math.round(a).toString();
    return (v < 0 ? '−' : '') + 'S/ ' + s;
  }
  function pct(n) { return (Math.round(n * 10) / 10).toLocaleString('en-US') + '%'; }
  function sum(arr, f) { return (arr || []).reduce(function (s, x) { return s + (Number(f ? f(x) : x) || 0); }, 0); }
  function parseDate(d) { var p = d.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtDate(d) { var x = parseDate(d); return DAYS[x.getDay()] + ' ' + x.getDate() + ' ' + MONTHS[x.getMonth()]; }
  function fmtShort(d) { var x = parseDate(d); return x.getDate() + ' ' + MONTHS[x.getMonth()]; }
  function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
  function daysTo(d) { return Math.round((parseDate(d) - today()) / 86400000); }
  function brandOf(id) { return (DATA.finance.brands || []).find(function (b) { return b.id === id; }) || { id: id, name: id, color: '#8C857B' }; }
  function withTaxes() { return $('#tax-toggle').checked; }
  function isActual(e) { return e.status === 'realizado'; }
  function hexA(hex, a) { var h = hex.replace('#', ''); var n = parseInt(h, 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  function totals(e) {
    var tax = withTaxes();
    var costs = (e.costs || []).filter(function (c) { return tax || c.category !== 'Impuestos'; });
    var income = sum(e.income, function (x) { return x.amount; });
    var cost = sum(costs, function (x) { return x.amount; });
    var stock = Number(e.stockLeft) || 0;
    var inv = sum(e.brandInvestment, function (x) { return x.amount; });
    var result = income - cost + stock;
    return { income: income, cost: cost, stock: stock, inv: inv, result: result, margin: income ? result / income * 100 : 0, coverage: cost ? (income + stock) / cost * 100 : 0, costs: costs };
  }
  function eventsSorted() { return (DATA.finance.events || []).slice().sort(function (a, b) { return a.date.localeCompare(b.date); }); }

  function destroyCharts() { charts.forEach(function (c) { try { c.destroy(); } catch (e) {} }); charts = []; }
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 2600); }

  // Cuenta animada de números.
  function countUp(el, to, fmt) {
    var dur = 1100, t0 = null, from = 0;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
    function step(ts) {
      if (!t0) t0 = ts;
      var p = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function animateBars(root) {
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      (root || document).querySelectorAll('[data-w]').forEach(function (i) { i.style.width = i.getAttribute('data-w'); });
    }); });
  }
  function runCounters(root) {
    (root || document).querySelectorAll('[data-count]').forEach(function (el) {
      var v = Number(el.getAttribute('data-count'));
      var kind = el.getAttribute('data-fmt');
      countUp(el, v, kind === 'int' ? function (x) { return Math.round(x).toLocaleString('en-US'); } : kind === 'pct' ? function (x) { return pct(x); } : function (x) { return money(x); });
    });
  }

  // ---------- Chart.js: estilo base ----------
  function chartDefaults() {
    if (!window.Chart) return;
    Chart.defaults.font.family = "'Inter', system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = '#57524B';
    Chart.defaults.borderColor = '#F0EBE3';
    Chart.defaults.animation.duration = 1200;
    Chart.defaults.animation.easing = 'easeOutQuart';
    Chart.defaults.plugins.legend.display = false;
    var tt = Chart.defaults.plugins.tooltip;

    tt.padding = 10; tt.cornerRadius = 10; tt.boxPadding = 4; tt.usePointStyle = true;
    tt.titleFont = { family: "'Inter', sans-serif", weight: '600', size: 12 };
  }
  function mk(canvas, cfg) { if (!window.Chart || !canvas) return null; var c = new Chart(canvas, cfg); charts.push(c); return c; }
  var moneyTick = function (v) { return short(v); };

  // ---------- Login y carga ----------
  async function api(body) {
    var r = await fetch('/api/ceo', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ passcode: PASS }, body || {})) });
    if (r.status === 401) throw new Error('unauthorized');
    if (!r.ok) throw new Error('server');
    return r.json();
  }

  async function load(silent) {
    var btn = $('#refresh'); btn.classList.add('spin');
    try {
      var d = await api();
      DATA = d;
      if (!DIRTY) DRAFT = JSON.parse(JSON.stringify(d.finance));
      render();
      if (!silent) toast('Datos actualizados');
    } catch (e) {
      if (e.message === 'unauthorized') { logout(); $('#login-err').textContent = 'Clave incorrecta.'; }
      else toast('No se pudo actualizar. Revisa tu conexión.');
    } finally { btn.classList.remove('spin'); }
  }

  function logout() { PASS = ''; ss('ceo_pass', null); $('#app').style.display = 'none'; $('#login').style.display = ''; }

  $('#login-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    PASS = $('#pass').value.trim();
    $('#login-err').textContent = '';
    try {
      DATA = await api();
      DRAFT = JSON.parse(JSON.stringify(DATA.finance));
      ss('ceo_pass', PASS);
      start();
    } catch (e) {
      $('#login-err').textContent = e.message === 'unauthorized' ? 'Clave incorrecta.' : 'No se pudo conectar.';
    }
  });

  function start() {
    $('#login').style.display = 'none';
    $('#app').style.display = 'block';
    chartDefaults();
    render();
    clearInterval(refreshTimer);
    refreshTimer = setInterval(function () { if (TAB !== 'edit' && document.visibilityState === 'visible') load(true); }, 60000);
  }

  $('#refresh').addEventListener('click', function () { load(false); });
  $('#tax-toggle').addEventListener('change', function () { this.nextElementSibling.nextElementSibling.textContent = this.checked ? 'Con impuestos' : 'Sin impuestos'; render(); });

  // ---------- Pestañas ----------
  function renderTabs() {
    var brands = DATA.finance.brands || [];
    var html = '<button data-tab="group" class="' + (TAB === 'group' ? 'on' : '') + '">Grupo</button>';
    brands.forEach(function (b) {
      html += '<button data-tab="' + esc(b.id) + '" class="' + (TAB === b.id ? 'on' : '') + '"><span class="dot" style="background:' + esc(b.color) + '"></span>' + esc(b.name) + '</button>';
    });
    html += '<button data-tab="edit" class="' + (TAB === 'edit' ? 'on' : '') + '">Editar datos</button>';
    $('#tabs').innerHTML = html;
    $('#tabs').querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-tab')); });
    });
  }
  function go(tab, eventId) {
    if (TAB === 'edit' && tab !== 'edit' && DIRTY) { toast('Tienes cambios sin guardar en "Editar datos".'); }
    TAB = tab;
    if (eventId && tab === 'edit') EDIT_ID = eventId;
    else if (eventId) SEL[tab] = eventId;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function render() {
    if (!DATA) return;
    destroyCharts();
    renderTabs();
    var b = brandOf(TAB);
    document.documentElement.style.setProperty('--accent', TAB === 'group' || TAB === 'edit' ? '#D93A1F' : b.color);
    var m = $('#main');
    if (TAB === 'group') m.innerHTML = groupPage();
    else if (TAB === 'edit') m.innerHTML = editPage();
    else m.innerHTML = brandPage(TAB);
    staggerCards(m);
    if (TAB === 'group') groupCharts();
    else if (TAB === 'edit') bindEditor();
    else brandCharts(TAB);
    runCounters(m);
    animateBars(m);
    m.querySelectorAll('[data-go]').forEach(function (el) {
      el.addEventListener('click', function () { go(el.getAttribute('data-go'), el.getAttribute('data-ev')); });
    });
  }
  function staggerCards(root) { root.querySelectorAll('.card').forEach(function (c, i) { c.style.animationDelay = Math.min(i * 45, 600) + 'ms'; }); }

  function stamp() {
    var t = new Date(DATA.generatedAt);
    return '<div class="stamp"><span class="live-dot"></span>Datos en vivo · ' + t.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }) + '</div>';
  }
  function kpi(label, value, foot, fmt, cls, barPct) {
    return '<div class="card kpi"><div class="label">' + esc(label) + '</div><div class="value num ' + (cls || '') + '" data-count="' + value + '" data-fmt="' + (fmt || 'money') + '">0</div>' +
      (foot ? '<div class="foot">' + foot + '</div>' : '') +
      (barPct != null ? '<div class="bar"><i data-w="' + Math.max(0, Math.min(100, barPct)) + '%"></i></div>' : '') + '</div>';
  }

  // ---------- Página: Grupo ----------
  function groupPage() {
    var evs = eventsSorted();
    var done = evs.filter(isActual), next = evs.filter(function (e) { return !isActual(e); });
    var tDone = done.map(totals), tNext = next.map(totals);
    var incDone = sum(tDone, function (t) { return t.income; });
    var resDone = sum(tDone, function (t) { return t.result; });
    var invDone = sum(tDone, function (t) { return t.inv; });
    var incNext = sum(tNext, function (t) { return t.income; });
    var resNext = sum(tNext, function (t) { return t.result; });
    var people = 0, issued = 0;
    Object.keys(DATA.live || {}).forEach(function (k) { if (k >= '2026-09-01') { people += DATA.live[k].ingresaron; issued += DATA.live[k].issued; } });
    var upcoming = next.filter(function (e) { return daysTo(e.date) >= 0; });

    var h = '';
    if (DATA.usingStaffPasscode) h += '<div class="warn-banner">Estás entrando con la clave del staff. Para que esta página sea solo tuya, crea la variable <b>CEO_PASSCODE</b> en Vercel con tu propia clave.</div>';
    h += '<div class="hero"><div><h1>' + esc(DATA.finance.company || 'Paradisio Entertainment Group') + '</h1><div class="sub">' + evs.length + ' fechas en ' + (DATA.finance.brands || []).length + ' marcas · ' + (withTaxes() ? 'resultados con IGV y renta' : 'resultados antes de IGV y renta') + '</div></div>' + stamp() + '</div>';
    h += '<div class="grid kpis">';
    h += kpi('Ingresos realizados', incDone, done.length + ' fecha' + (done.length === 1 ? '' : 's') + ' cerrada' + (done.length === 1 ? '' : 's'));
    h += kpi('Resultado realizado', resDone, 'Con el stock que quedó · inversión en marca aparte: ' + money(invDone), 'money', resDone >= 0 ? 'pos' : 'neg');
    h += kpi('Ingresos proyectados', incNext, upcoming.length + ' próxima' + (upcoming.length === 1 ? '' : 's') + ' fecha' + (upcoming.length === 1 ? '' : 's'));
    h += kpi('Utilidad proyectada', resNext, 'Si se cumplen los presupuestos', 'money', resNext >= 0 ? 'pos' : 'neg');
    h += kpi('Personas que entraron', people, issued ? pct(people / issued * 100) + ' de los QRs emitidos' : 'Desde la web de tickets', 'int', '', issued ? people / issued * 100 : null);
    h += '</div>';

    h += '<div class="grid two">';
    h += '<div class="card"><div class="card-head"><div><h3>Ingresos y costos por fecha</h3><div class="hint">Barras de color: ingresos de cada marca · gris: costos · las fechas futuras son presupuesto</div></div>' +
      '<div class="legend">' + (DATA.finance.brands || []).map(function (b) { return '<span><i style="background:' + b.color + '"></i>' + esc(b.name) + '</span>'; }).join('') + '<span><i style="background:var(--cost)"></i>Costos</span></div></div>' +
      '<div class="chart-box tall"><canvas id="c-ic"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Próximas fechas</h3><div class="hint">Toca una para ver su detalle</div></div></div><div class="timeline">' +
      (upcoming.length ? upcoming.map(tlItem).join('') : '<div class="note">No hay fechas próximas cargadas.</div>') + '</div></div>';
    h += '</div>';

    h += '<div class="grid two row-gap">';
    h += '<div class="card"><div class="card-head"><div><h3>Resultado acumulado del grupo</h3><div class="hint">Línea continua: real · punteada: proyectado</div></div></div><div class="chart-box"><canvas id="c-cum"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Ingresos por marca</h3><div class="hint">Realizado + proyectado</div></div></div><div class="chart-box"><canvas id="c-mix"></canvas></div><div class="legend" id="mix-legend" style="margin-top:12px;justify-content:center"></div></div>';
    h += '</div>';

    h += '<div class="section-title"><h2>Marcas</h2><span>Resumen de cada una</span></div><div class="grid brand-cards">';
    (DATA.finance.brands || []).forEach(function (b) {
      var be = evs.filter(function (e) { return e.brand === b.id; });
      var bt = be.map(totals);
      var nx = be.filter(function (e) { return daysTo(e.date) >= 0; })[0];
      h += '<div class="card brand-card" style="--c:' + b.color + '" data-go="' + esc(b.id) + '"><span class="tag"><span class="dot" style="background:' + b.color + '"></span>' + be.length + ' fecha' + (be.length === 1 ? '' : 's') + '</span>' +
        '<h3>' + esc(b.name) + '</h3><div class="tagline">' + esc(b.tagline || '') + '</div>' +
        '<div class="mini-stats"><div><small>Ingresos (real + proy.)</small><b class="num">' + money(sum(bt, function (t) { return t.income; })) + '</b></div>' +
        '<div><small>Resultado (real + proy.)</small><b class="num ' + (sum(bt, function (t) { return t.result; }) >= 0 ? 'pos' : 'neg') + '">' + money(sum(bt, function (t) { return t.result; })) + '</b></div>' +
        '<div><small>Próxima fecha</small><b>' + (nx ? fmtShort(nx.date) : '—') + '</b></div>' +
        '<div><small>Faltan</small><b>' + (nx ? daysTo(nx.date) + ' días' : '—') + '</b></div></div></div>';
    });
    h += '</div>';
    return h;
  }

  function tlItem(e) {
    var b = brandOf(e.brand), t = totals(e), d = parseDate(e.date), n = daysTo(e.date);
    var noFin = !(e.costs || []).length;
    return '<div class="tl-item" data-go="' + esc(e.brand) + '" data-ev="' + esc(e.id) + '">' +
      '<div class="tl-date" style="background:' + b.color + '"><small>' + MONTHS[d.getMonth()] + '</small><b>' + d.getDate() + '</b></div>' +
      '<div><div class="tl-name">' + esc(e.name) + '</div><div class="tl-meta">' + esc(b.name) + ' · ' + esc(e.venue || '') + ' · ' + (n === 0 ? 'hoy' : n === 1 ? 'mañana' : 'en ' + n + ' días') + '</div></div>' +
      '<div class="tl-right"><span class="tag ' + esc(e.status) + '">' + esc(e.status) + '</span><div class="serif num ' + (noFin ? '' : t.result >= 0 ? 'pos' : 'neg') + '" style="margin-top:6px">' + (noFin ? (t.income ? money(t.income) : '—') : money(t.result)) + '</div><div class="tl-meta">' + (noFin ? (t.income ? 'ingreso · sin costos' : 'costos por definir') : 'utilidad proy.') + '</div></div></div>';
  }

  function groupCharts() {
    var evs = eventsSorted();
    var labels = evs.map(function (e) { return fmtShort(e.date) + ' · ' + brandOf(e.brand).name.replace('Paradisio ', 'P. '); });
    mk($('#c-ic'), {
      type: 'bar',
      data: { labels: labels, datasets: [
        { label: 'Ingresos', data: evs.map(function (e) { return totals(e).income; }), backgroundColor: evs.map(function (e) { var c = brandOf(e.brand).color; return isActual(e) ? c : hexA(c, .55); }), borderRadius: 6, borderSkipped: 'bottom', maxBarThickness: 46 },
        { label: 'Costos', data: evs.map(function (e) { return totals(e).cost; }), backgroundColor: evs.map(function (e) { return isActual(e) ? '#BDB5A9' : 'rgba(189,181,169,.55)'; }), borderRadius: 6, borderSkipped: 'bottom', maxBarThickness: 46 },
      ] },
      options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: moneyTick }, border: { display: false } } },
        plugins: { tooltip: { callbacks: { title: function (it) { var e = evs[it[0].dataIndex]; return e.name + ' (' + e.status + ')'; }, label: function (c) { return ' ' + c.dataset.label + ': ' + money(c.raw); },
          footer: function (it) { var t = totals(evs[it[0].dataIndex]); return 'Resultado: ' + money(t.result) + (t.stock ? ' (incluye stock ' + money(t.stock) + ')' : ''); } } } } },
    });

    var acc = 0, cum = evs.map(function (e) { acc += totals(e).result; return acc; });
    var lastActual = -1; evs.forEach(function (e, i) { if (isActual(e)) lastActual = i; });
    mk($('#c-cum'), {
      type: 'line',
      data: { labels: evs.map(function (e) { return fmtShort(e.date); }), datasets: [{ label: 'Resultado acumulado', data: cum, borderColor: '#1A1816', backgroundColor: function (ctx) { var c = ctx.chart, a = c.chartArea; if (!a) return 'rgba(26,24,22,.06)'; var g = c.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, 'rgba(217,58,31,.18)'); g.addColorStop(1, 'rgba(217,58,31,0)'); return g; },
        fill: true, cubicInterpolationMode: 'monotone', borderWidth: 2, pointRadius: 5, pointHoverRadius: 7, pointBackgroundColor: evs.map(function (e) { return brandOf(e.brand).color; }), pointBorderColor: '#fff', pointBorderWidth: 2,
        segment: { borderDash: function (ctx) { return ctx.p1DataIndex > lastActual ? [6, 5] : undefined; } } }] },
      options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: moneyTick }, border: { display: false }, grid: { color: function (c) { return c.tick.value === 0 ? '#BDB5A9' : '#F0EBE3'; } } } },
        plugins: { tooltip: { callbacks: { title: function (it) { return evs[it[0].dataIndex].name; }, label: function (c) { return ' Acumulado: ' + money(c.raw); }, afterLabel: function (c) { return ' Esta fecha: ' + money(totals(evs[c.dataIndex]).result); } } } } },
    });

    var brands = DATA.finance.brands || [];

      options: { maintainAspectRatio: false, cutout: '68%', animation: { animateRotate: true, duration: 1400 }, plugins: { tooltip: { callbacks: { label: function (c) { return ' ' + c.label + ': ' + money(c.raw) + ' (' + (tot ? pct(c.raw / tot * 100) : '0%') + ')'; } } } } },

    });
    $('#mix-legend').innerHTML = brands.map(function (b, i) { return '<span><i style="background:' + b.color + '"></i>' + esc(b.name) + ' · ' + (tot ? pct(byB[i] / tot * 100) : '0%') + '</span>'; }).join('');

  // ---------- Página: Marca ----------
  function brandPage(bid) {
    var b = brandOf(bid);
    var evs = eventsSorted().filter(function (e) { return e.brand === bid; });
    var h = '<div class="brand-hero"><div class="swatch">' + esc(b.name.replace('Paradisio ', '').charAt(0)) + '</div><div><h1>' + esc(b.name) + '</h1><div class="sub">' + esc(b.tagline || '') + ' · ' + evs.length + ' fecha' + (evs.length === 1 ? '' : 's') + '</div></div><div style="margin-left:auto">' + stamp() + '</div></div>';
    if (!evs.length) {
      return h + '<div class="card empty"><div class="big">Todavía no hay fechas</div><p>Crea la primera fecha de ' + esc(b.name) + ' en "Editar datos" para ver aquí su presupuesto, resultados y números en vivo.</p><button class="btn" data-go="edit">Crear fecha</button></div>';
    }
    var sel = evs.find(function (e) { return e.id === SEL[bid]; });
    if (!sel) {
      var up = evs.filter(function (e) { return daysTo(e.date) >= 0; });
      var done = evs.filter(isActual);
      sel = done.length && !up.length ? done[done.length - 1] : (done.length ? done[done.length - 1] : up[0]);
      SEL[bid] = sel.id;
    }
    h += '<div class="pills">' + evs.map(function (e) {

    }).join('') + '</div>';

    var t = totals(sel);
    var noCosts = !(sel.costs || []).length;
    var actual = isActual(sel);
    h += '<div class="hero" style="margin-bottom:16px"><div><h1 style="font-size:28px">' + esc(sel.name) + '</h1><div class="sub">' + esc(fmtDate(sel.date)) + ' · ' + esc(sel.venue || '') + ' · <span class="tag ' + esc(sel.status) + '">' + esc(sel.status) + '</span>' +
      (daysTo(sel.date) >= 0 ? ' · faltan <b>' + daysTo(sel.date) + '</b> días' : '') + '</div></div>' +
      '<button class="btn ghost small" data-go="edit" data-ev="' + esc(sel.id) + '">Editar esta fecha</button></div>';

    if (noCosts && !(sel.income || []).length) {
      h += '<div class="card empty"><div class="big">Costos e ingresos por definir</div><p>' + esc(sel.notes || '') + ' Cuando tengas los números, cárgalos y aquí aparece el resultado proyectado.</p>' +
        '<div class="checklist"><div>□ Local y consumo mínimo</div><div>□ DJs y talento</div><div>□ Personal: barra, seguridad, limpieza</div><div>□ Producción y decoración temática</div><div>□ Promotores y marketing</div><div>□ Precios de entradas, boxes y barra</div></div>' +
        '<button class="btn" data-go="edit" data-ev="' + esc(sel.id) + '">Cargar números</button></div>';
      return h;
    }

    h += '<div class="grid kpis">';

    h += kpi(actual ? 'Costos' : 'Costos proyectados', t.cost, noCosts ? 'Todavía sin costos cargados' : (withTaxes() ? 'Con IGV y renta' : 'Sin IGV ni renta'));
    h += kpi(actual ? 'Resultado' : 'Utilidad proyectada', t.result, t.stock ? 'Incluye stock que quedó: ' + money(t.stock) : (noCosts ? 'Ingreso limpio hasta cargar costos' : ''), 'money', t.result >= 0 ? 'pos' : 'neg');
    h += kpi('Margen', t.margin, 'Resultado sobre ingresos', 'pct', t.margin >= 0 ? 'pos' : 'neg', Math.max(0, t.margin));
    if (noCosts) h += '<div class="card kpi"><div class="label">Cobertura de costos</div><div class="value" style="color:var(--muted)">—</div><div class="foot">Se calcula cuando cargues los costos</div></div>';
    else h += kpi('Cobertura de costos', t.coverage, t.coverage >= 100 ? 'Ingresos cubren los costos' : 'Faltan ' + money(t.cost - t.income - t.stock) + ' para el break-even', 'pct', t.coverage >= 100 ? 'pos' : 'neg', Math.min(100, t.coverage));
    h += '</div>';

    h += '<div class="grid halves">';
    h += '<div class="card"><div class="card-head"><div><h3>De dónde viene la plata</h3><div class="hint">Ingresos por fuente</div></div></div><div class="chart-box short"><canvas id="c-inc"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>En qué se va</h3><div class="hint">Costos por categoría · pasa el mouse para ver el detalle</div></div></div>' + (noCosts ? '<div class="empty" style="padding:40px 10px"><p>Todavía no hay costos para esta fecha.</p><button class="btn small" data-go="edit" data-ev="' + esc(sel.id) + '">Cargar costos</button></div>' : '<div class="chart-box short"><canvas id="c-cost"></canvas></div>') + '</div>';
    h += '</div>';

    // P&L detallado
    h += '<div class="grid two row-gap" style="align-items:start"><div class="card"><div class="card-head"><div><h3>Estado de resultados</h3><div class="hint">' + (actual ? 'Real' : 'Presupuesto') + '</div></div></div>' + plTable(sel, t) + '</div>';
    h += '<div class="card"><div class="card-head"><div><h3>Notas</h3></div></div><div class="note">' + esc(sel.notes || 'Sin notas.') + '</div>';
    if ((sel.brandInvestment || []).length) {
      h += '<div style="margin-top:18px"><h3 style="font-size:15px">Inversión en la marca</h3><div class="hint" style="margin-bottom:8px">Activos que se reusan · no cuentan en el resultado de la fecha</div><table class="t">' +
        sel.brandInvestment.map(function (x) { return '<tr><td>' + esc(x.label) + '</td><td class="r num">' + money(x.amount) + '</td></tr>'; }).join('') +
        '<tr class="total"><td>Total</td><td class="r num">' + money(t.inv) + '</td></tr></table></div>';
    }
    var prev = evs.filter(function (e) { return e.date < sel.date && (e.costs || []).length; }).pop();
    if (prev) h += '<div style="margin-top:18px"><h3 style="font-size:15px">Contra ' + esc(fmtShort(prev.date)) + '</h3><div class="chart-box short" style="height:200px"><canvas id="c-cmp"></canvas></div><div class="legend" style="margin-top:8px"><span><i style="background:#BDB5A9"></i>' + esc(fmtShort(prev.date)) + ' (' + esc(prev.status) + ')</span><span><i style="background:' + b.color + '"></i>' + esc(fmtShort(sel.date)) + ' (' + esc(sel.status) + ')</span></div></div>';
    h += '</div></div>';

    // En vivo
    var live = sel.liveEventId && DATA.live ? DATA.live[sel.liveEventId] : null;
    if (live) h += livePart(live);
    else if (sel.liveEventId) h += '<div class="section-title"><h2>En la puerta</h2><span>En vivo desde la web de tickets</span></div><div class="card"><div class="note">Todavía no hay registros para esta fecha en la web. Aparecen aquí apenas se abra el registro.</div></div>';

    if (sel.bar) h += barPart(sel.bar);
    if ((sel.stock || []).length) h += stockPart(sel);
    return h;
  }

  function plTable(e, t) {
    var rows = '';
    rows += '<tr><td colspan="2" style="color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:4px">Ingresos</td></tr>';
    (e.income || []).forEach(function (x) { rows += '<tr><td>' + esc(x.label) + '</td><td class="r num">' + money(x.amount) + '</td></tr>'; });
    rows += '<tr class="total"><td>Total ingresos</td><td class="r num">' + money(t.income) + '</td></tr>';
    rows += '<tr><td colspan="2" style="color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-top:16px">Costos</td></tr>';
    var max = Math.max.apply(null, t.costs.map(function (x) { return Number(x.amount) || 0; }).concat([1]));
    t.costs.slice().sort(function (a, b) { return b.amount - a.amount; }).forEach(function (x) {
      rows += '<tr><td><div class="bar-cell"><span style="min-width:180px">' + esc(x.label) + ' <span class="tag" style="margin-left:4px">' + esc(x.category || '') + '</span></span><span class="mini"><i data-w="' + (x.amount / max * 100) + '%"></i></span></div></td><td class="r num">' + money(x.amount, x.amount % 1 ? 2 : 0) + '</td></tr>';
    });
    rows += '<tr class="total"><td>Total costos</td><td class="r num">' + money(t.cost) + '</td></tr>';
    if (t.stock) rows += '<tr><td>+ Stock que quedó (a costo)</td><td class="r num">' + money(t.stock) + '</td></tr>';
    rows += '<tr class="total"><td>Resultado</td><td class="r num ' + (t.result >= 0 ? 'pos' : 'neg') + '">' + money(t.result) + '</td></tr>';
    return '<table class="t">' + rows + '</table>';
  }

  function livePart(L) {
    var h = '<div class="section-title"><h2>En la puerta</h2><span>En vivo desde la web de tickets · sin datos personales</span></div>';
    h += '<div class="grid kpis four">';
    h += kpi('Registros', L.registros, L.anulados + ' anulados · ' + L.vigentes + ' vigentes', 'int');
    h += kpi('QRs emitidos', L.issued, L.pending + ' pendientes de QR', 'int');
    h += kpi('Entraron', L.ingresaron, L.aTiempo + ' a tiempo · ' + L.tarde + ' después de hora', 'int', '', L.issued ? L.ingresaron / L.issued * 100 : 0);
    h += kpi('Conversión', L.conversion, 'De QR emitido a persona adentro', 'pct', '', L.conversion);
    h += '</div>';
    var max = Math.max(L.registros, 1);
    h += '<div class="grid two"><div class="card"><div class="card-head"><div><h3>Curva de ingreso</h3><div class="hint">Personas adentro, acumulado cada 15 minutos</div></div></div><div class="chart-box"><canvas id="c-door"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Embudo</h3><div class="hint">Del registro a la pista</div></div></div><div class="funnel">' +
      funnelRow('Registros', L.registros, max, 'Todo lo que entró por la web') +
      funnelRow('Vigentes', L.vigentes, max, 'Sin anulados ni rechazados') +
      funnelRow('QRs emitidos', L.issued, max, (L.withPromoter + ' con promotor · ' + L.withoutPromoter + ' sin promotor')) +
      funnelRow('Entraron', L.ingresaron, max, L.tardeCobrado + ' pagaron después de hora') + '</div></div></div>';

    h += '<div class="grid thirds row-gap">';
    h += '<div class="card"><div class="card-head"><div><h3>Edades</h3><div class="hint">Quienes entraron</div></div></div><div class="chart-box short"><canvas id="c-age"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Registros por día</h3><div class="hint">Cómo se movió la demanda</div></div></div><div class="chart-box short"><canvas id="c-reg"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Mix de tipos</h3><div class="hint">QRs vigentes por tipo</div></div></div><div class="chart-box short"><canvas id="c-type"></canvas></div></div>';
    h += '</div>';

    var top = (L.promoters || []).slice(0, 12);
    if (top.length) {
      h += '<div class="card row-gap"><div class="card-head"><div><h3>Promotores</h3><div class="hint">QRs que generó cada uno y cuántos de esos entraron · top ' + top.length + ' de ' + L.promoters.length + '</div></div>' +
        '<div class="legend"><span><i style="background:#BDB5A9"></i>QRs emitidos</span><span><i style="background:var(--accent)"></i>Entraron</span></div></div>' +
        '<div class="chart-box" style="height:' + Math.max(240, top.length * 30) + 'px"><canvas id="c-promo"></canvas></div></div>';
    }
    return h;
  }
  function funnelRow(label, n, max, sub) {
    return '<div class="funnel-row"><div class="top"><span>' + esc(label) + '</span><b class="num">' + n.toLocaleString('en-US') + '</b></div><div class="track"><i data-w="' + (n / max * 100) + '%"></i></div><small>' + esc(sub || '') + '</small></div>';
  }

  function barPart(B) {
    var h = '<div class="section-title"><h2>Barra</h2><span>Cierre de los POS</span></div>';
    h += '<div class="grid kpis four">';
    h += kpi('Operaciones', B.operations || 0, 'Cobros en los POS', 'int');
    h += kpi('Ticket promedio', B.avgTicket || 0, 'Por operación');
    if (B.cocktails) h += kpi('Cócteles vendidos', B.cocktails.units, money(B.cocktails.amount) + ' en cócteles', 'int');
    var totPay = sum(B.payments, function (x) { return x.amount; });
    var visa = (B.payments || []).find(function (x) { return x.label === 'Visa'; });
    h += kpi('Pago con tarjeta', totPay ? (totPay - sum((B.payments || []).filter(function (x) { return x.label === 'Yape'; }), function (x) { return x.amount; })) / totPay * 100 : 0, visa ? 'Visa sola: ' + pct(visa.amount / totPay * 100) : '', 'pct');
    h += '</div><div class="grid thirds">';
    h += '<div class="card"><div class="card-head"><div><h3>Por terminal</h3><div class="hint">Monto cobrado</div></div></div><div class="chart-box short"><canvas id="c-term"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Medios de pago</h3></div></div><div class="chart-box short"><canvas id="c-pay"></canvas></div></div>';
    h += '<div class="card"><div class="card-head"><div><h3>Contra lo proyectado</h3><div class="hint">Qué se vendió vs. lo que se esperaba</div></div></div><div class="progress">' +
      (B.vsProjection || []).map(function (x) { var c = x.pct >= 70 ? 'var(--good)' : x.pct >= 40 ? 'var(--icon)' : 'var(--bad)'; return '<div class="p-row"><div class="top"><span>' + esc(x.label) + '</span><b class="num">' + x.pct + '%</b></div><div class="track"><i data-w="' + Math.min(100, x.pct) + '%" style="background:' + c + '"></i></div></div>'; }).join('') + '</div></div>';
    h += '</div>';
    return h;
  }

  function stockPart(e) {
    var tot = sum(e.stock, function (x) { return x.cost; });
    var max = Math.max.apply(null, e.stock.map(function (x) { return x.cost; }));
    return '<div class="section-title"><h2>Stock que quedó</h2><span>Valorizado a costo · ' + money(tot) + '</span></div><div class="card"><table class="t"><tr><th>Grupo</th><th>Qué queda</th><th class="r">Costo</th></tr>' +
      e.stock.slice().sort(function (a, b) { return b.cost - a.cost; }).map(function (x) {
        return '<tr><td><div class="bar-cell"><span style="min-width:170px">' + esc(x.label) + '</span><span class="mini"><i data-w="' + (x.cost / max * 100) + '%"></i></span></div></td><td style="color:var(--ink-2)">' + esc(x.detail || '') + '</td><td class="r num">' + money(x.cost, 2) + '</td></tr>';
      }).join('') + '<tr class="total"><td>Total</td><td></td><td class="r num">' + money(tot, 2) + '</td></tr></table></div>';
  }

  function brandCharts(bid) {
    var b = brandOf(bid);
    var sel = (DATA.finance.events || []).find(function (e) { return e.id === SEL[bid]; });
    if (!sel) return;
    var t = totals(sel);
    var hBar = function (labels, data, color, fmt) {
      return { type: 'bar', data: { labels: labels, datasets: [{ data: data, backgroundColor: color, borderRadius: 5, borderSkipped: 'left', maxBarThickness: 24 }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, scales: { x: { ticks: { callback: fmt || moneyTick }, border: { display: false } }, y: { grid: { display: false } } } } };
    };
    var inc = (sel.income || []).slice().sort(function (a, b) { return b.amount - a.amount; });
    var c1 = hBar(inc.map(function (x) { return x.label; }), inc.map(function (x) { return x.amount; }), b.color);
    c1.options.plugins = { tooltip: { callbacks: { label: function (c) { return ' ' + money(c.raw) + ' · ' + (t.income ? pct(c.raw / t.income * 100) : ''); } } } };
    mk($('#c-inc'), c1);

    var cats = {};
    t.costs.forEach(function (x) { var k = x.category || 'Otros'; (cats[k] = cats[k] || []).push(x); });
    var catList = Object.keys(cats).map(function (k) { return { k: k, v: sum(cats[k], function (x) { return x.amount; }), items: cats[k] }; }).sort(function (a, b) { return b.v - a.v; });
    var c2 = hBar(catList.map(function (x) { return x.k; }), catList.map(function (x) { return x.v; }), '#8C857B');
    c2.data.datasets[0].backgroundColor = catList.map(function (x, i) { return i === 0 ? '#57524B' : '#BDB5A9'; });
    c2.options.plugins = { tooltip: { callbacks: { label: function (c) { return ' ' + money(c.raw) + ' · ' + (t.cost ? pct(c.raw / t.cost * 100) : ''); }, afterLabel: function (c) { return catList[c.dataIndex].items.map(function (x) { return '  · ' + x.label + ': ' + money(x.amount); }).join('\n'); } } } };
    if ($('#c-cost')) mk($('#c-cost'), c2);

    var evs = eventsSorted().filter(function (e) { return e.brand === bid; });
    var prev = evs.filter(function (e) { return e.date < sel.date && (e.costs || []).length; }).pop();
    if (prev && $('#c-cmp')) {
      var tp = totals(prev);
      var keys = ['Ingresos'].concat(Array.from(new Set(tp.costs.concat(t.costs).map(function (x) { return x.category || 'Otros'; }))));
      var val = function (tt, k) { return k === 'Ingresos' ? tt.income : sum(tt.costs.filter(function (x) { return (x.category || 'Otros') === k; }), function (x) { return x.amount; }); };
      mk($('#c-cmp'), { type: 'bar', data: { labels: keys, datasets: [
        { label: fmtShort(prev.date), data: keys.map(function (k) { return val(tp, k); }), backgroundColor: '#BDB5A9', borderRadius: 4, maxBarThickness: 18 },
        { label: fmtShort(sel.date), data: keys.map(function (k) { return val(t, k); }), backgroundColor: b.color, borderRadius: 4, maxBarThickness: 18 }] },
        options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { grid: { display: false }, ticks: { font: { size: 10 } } }, y: { ticks: { callback: moneyTick }, border: { display: false } } },
          plugins: { tooltip: { callbacks: { label: function (c) { return ' ' + c.dataset.label + ': ' + money(c.raw); } } } } } });
    }

    var L = sel.liveEventId && DATA.live ? DATA.live[sel.liveEventId] : null;
    if (L) {
      if ($('#c-door')) mk($('#c-door'), { type: 'line', data: { labels: L.checkins.map(function (x) { return x.t; }), datasets: [{ label: 'Adentro', data: L.checkins.map(function (x) { return x.acc; }), borderColor: b.color, borderWidth: 2, tension: .35, pointRadius: 0, pointHoverRadius: 5, fill: true,
        backgroundColor: function (ctx) { var c = ctx.chart, a = c.chartArea; if (!a) return hexA(b.color, .1); var g = c.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, hexA(b.color, .28)); g.addColorStop(1, hexA(b.color, 0)); return g; } }] },
        options: { maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 10 } }, y: { beginAtZero: true, border: { display: false } } },
          plugins: { tooltip: { callbacks: { label: function (c) { return ' Adentro: ' + c.raw; }, afterLabel: function (c) { return ' Entraron en estos 15 min: ' + L.checkins[c.dataIndex].n; } } } } } });
      mk($('#c-age'), { type: 'bar', data: { labels: L.agesAttended.map(function (x) { return x.label; }), datasets: [{ data: L.agesAttended.map(function (x) { return x.n; }), backgroundColor: b.color, borderRadius: 5, maxBarThickness: 34 }] },
        options: { maintainAspectRatio: false, scales: { x: { grid: { display: false } }, y: { beginAtZero: true, border: { display: false } } }, plugins: { tooltip: { callbacks: { label: function (c) { var tot = sum(L.agesAttended, function (x) { return x.n; }); return ' ' + c.raw + ' personas · ' + (tot ? pct(c.raw / tot * 100) : ''); } } } } } });
      mk($('#c-reg'), { type: 'bar', data: { labels: L.registrations.map(function (x) { return fmtShort(x.d); }), datasets: [{ data: L.registrations.map(function (x) { return x.n; }), backgroundColor: hexA(b.color, .75), borderRadius: 4, maxBarThickness: 22 }] },
        options: { maintainAspectRatio: false, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true, border: { display: false } } }, plugins: { tooltip: { callbacks: { label: function (c) { return ' ' + c.raw + ' registros'; } } } } } });
      var types = [['Free entry', L.byType.promo + L.byType.free], ['Pagadas', L.byType.paid], ['Mesas y boxes', L.byType.table]].filter(function (x) { return x[1] > 0; });
      mk($('#c-type'), { type: 'doughnut', data: { labels: types.map(function (x) { return x[0]; }), datasets: [{ data: types.map(function (x) { return x[1]; }), backgroundColor: [b.color, '#57524B', '#BDB5A9'], borderColor: '#fff', borderWidth: 3 }] },
        options: { maintainAspectRatio: false, cutout: '64%', plugins: { legend: { display: true, position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, useBorderRadius: true, borderRadius: 3 } } } } });
      var top = (L.promoters || []).slice(0, 12);
      if (top.length && $('#c-promo')) mk($('#c-promo'), { type: 'bar', data: { labels: top.map(function (p) { return p.name; }), datasets: [
        { label: 'QRs emitidos', data: top.map(function (p) { return p.qrs; }), backgroundColor: '#BDB5A9', borderRadius: 4, maxBarThickness: 12 },
        { label: 'Entraron', data: top.map(function (p) { return p.ingresaron; }), backgroundColor: b.color, borderRadius: 4, maxBarThickness: 12 }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, scales: { x: { beginAtZero: true, border: { display: false } }, y: { grid: { display: false } } },
          plugins: { tooltip: { callbacks: { afterBody: function (it) { var p = top[it[0].dataIndex]; return 'Conversión: ' + (p.qrs ? pct(p.ingresaron / p.qrs * 100) : '—'); } } } } } });
    }
    if (sel.bar) {
      var B = sel.bar;
      mk($('#c-term'), { type: 'bar', data: { labels: (B.terminals || []).map(function (x) { return x.label; }), datasets: [{ data: (B.terminals || []).map(function (x) { return x.amount; }), backgroundColor: b.color, borderRadius: 5, maxBarThickness: 22 }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, scales: { x: { ticks: { callback: moneyTick }, border: { display: false } }, y: { grid: { display: false }, ticks: { font: { size: 11 } } } },
          plugins: { tooltip: { callbacks: { label: function (c) { var x = B.terminals[c.dataIndex]; return ' ' + money(x.amount) + ' · ' + x.ops + ' operaciones · ticket ' + money(x.amount / x.ops); } } } } } });
      var pays = (B.payments || []).slice().sort(function (a, b) { return b.amount - a.amount; });
      var pt = sum(pays, function (x) { return x.amount; });
      mk($('#c-pay'), { type: 'bar', data: { labels: pays.map(function (x) { return x.label; }), datasets: [{ data: pays.map(function (x) { return x.amount; }), backgroundColor: pays.map(function (x, i) { return i === 0 ? '#57524B' : '#BDB5A9'; }), borderRadius: 5, maxBarThickness: 22 }] },
        options: { indexAxis: 'y', maintainAspectRatio: false, scales: { x: { ticks: { callback: moneyTick }, border: { display: false } }, y: { grid: { display: false } } }, plugins: { tooltip: { callbacks: { label: function (c) { return ' ' + money(c.raw) + ' · ' + pct(c.raw / pt * 100); } } } } } });
    }
  }

  // ---------- Página: Editar ----------
  function editPage() {
    var f = DRAFT;
    var evs = f.events.slice().sort(function (a, b) { return a.date.localeCompare(b.date); });
    if (!EDIT_ID || !f.events.find(function (e) { return e.id === EDIT_ID; })) EDIT_ID = evs.length ? evs[0].id : null;
    var h = '<div class="hero"><div><h1>Editar datos</h1><div class="sub">Lo que cambies aquí se refleja en todo el dashboard al guardar.' + (DATA.seeded ? ' Ahora estás viendo los datos de arranque.' : '') + '</div></div></div>';
    h += '<div class="grid editor"><div class="card"><div class="ev-list">';
    f.brands.forEach(function (b) {
      h += '<div class="grp"><span class="dot" style="background:' + b.color + '"></span>' + esc(b.name) + '</div>';
      evs.filter(function (e) { return e.brand === b.id; }).forEach(function (e) {
        h += '<button data-edit="' + esc(e.id) + '" class="' + (e.id === EDIT_ID ? 'on' : '') + '">' + esc(e.name) + '<small>' + esc(fmtDate(e.date)) + ' · ' + esc(e.status) + '</small></button>';
      });
    });
    h += '</div><div style="margin-top:16px;display:grid;gap:8px"><select class="in" id="new-brand">' + f.brands.map(function (b) { return '<option value="' + esc(b.id) + '">' + esc(b.name) + '</option>'; }).join('') + '</select><button class="btn small" id="new-ev">+ Nueva fecha</button></div></div>';
    var e = f.events.find(function (x) { return x.id === EDIT_ID; });
    h += '<div class="card">' + (e ? eventForm(e) : '<div class="empty"><div class="big">No hay fechas</div></div>') + '</div></div>';
    h += '<div class="save-bar"><span id="dirty-msg">' + (DIRTY ? 'Tienes cambios sin guardar' : 'Todo guardado') + '</span><div style="display:flex;gap:8px"><button class="btn small ghost" id="reset-data">Restaurar datos de arranque</button><button class="btn small ghost" id="discard">Descartar</button><button class="btn small" id="save">Guardar cambios</button></div></div>';
    h += '<datalist id="cats">' + CATEGORIES.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist>';
    return h;
  }
  function eventForm(e) {
    var f = DRAFT;
    var h = '<div class="form-grid">';
    h += '<label class="wide">Nombre<input class="in" data-f="name" value="' + esc(e.name) + '"></label>';
    h += '<label>Marca<select class="in" data-f="brand">' + f.brands.map(function (b) { return '<option value="' + esc(b.id) + '"' + (b.id === e.brand ? ' selected' : '') + '>' + esc(b.name) + '</option>'; }).join('') + '</select></label>';
    h += '<label>Fecha<input class="in" type="date" data-f="date" value="' + esc(e.date) + '"></label>';
    h += '<label>Estado<select class="in" data-f="status">' + STATUSES.map(function (s) { return '<option' + (s === e.status ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></label>';
    h += '<label>Local<input class="in" data-f="venue" value="' + esc(e.venue || '') + '"></label>';
    h += '<label>Fecha en la web de tickets<input class="in" data-f="liveEventId" placeholder="AAAA-MM-DD" value="' + esc(e.liveEventId || '') + '"></label>';
    h += '<label>Stock que quedó (S/)<input class="in" type="number" step="0.01" data-f="stockLeft" value="' + esc(e.stockLeft || '') + '"></label>';
    h += '<label class="wide">Notas<textarea class="in" data-f="notes">' + esc(e.notes || '') + '</textarea></label>';
    h += '</div>';
    h += linesBlock('Ingresos', 'income', e.income || [], true);
    h += linesBlock('Costos', 'costs', e.costs || [], true);
    h += linesBlock('Inversión en la marca', 'brandInvestment', e.brandInvestment || [], false);
    h += '<div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center"><span class="hint" id="form-total"></span><button class="btn small ghost" id="del-ev" style="color:var(--bad)">Eliminar esta fecha</button></div>';
    return h;
  }
  function linesBlock(title, key, lines, withCat) {
    var h = '<div class="lines"><h3>' + title + ' <button class="btn small ghost" data-add="' + key + '">+ Agregar</button></h3>';
    if (!lines.length) h += '<div class="hint" style="margin-top:8px">Sin líneas todavía.</div>';
    lines.forEach(function (l, i) {
      h += '<div class="line-row" data-k="' + key + '" data-i="' + i + '"><input class="in" data-l="label" placeholder="Concepto" value="' + esc(l.label) + '">' +
        (withCat ? '<input class="in cat" data-l="category" list="cats" placeholder="Categoría" value="' + esc(l.category || '') + '">' : '<span></span>') +
        '<input class="in amt num" type="number" step="0.01" data-l="amount" value="' + esc(l.amount) + '"><button class="del" data-del="' + key + ':' + i + '" title="Quitar">×</button></div>';
    });
    return h + '</div>';
  }
  function markDirty() { DIRTY = true; var m = $('#dirty-msg'); if (m) m.textContent = 'Tienes cambios sin guardar'; updateFormTotal(); }
  function updateFormTotal() {
    var e = DRAFT.events.find(function (x) { return x.id === EDIT_ID; }); var el = $('#form-total');
    if (!e || !el) return; var t = totals(e);
    el.innerHTML = 'Ingresos ' + money(t.income) + ' · Costos ' + money(t.cost) + ' · <b class="' + (t.result >= 0 ? 'pos' : 'neg') + '">Resultado ' + money(t.result) + '</b>';
  }
  function bindEditor() {
    var m = $('#main');
    updateFormTotal();
    m.querySelectorAll('[data-edit]').forEach(function (b) { b.addEventListener('click', function () { EDIT_ID = b.getAttribute('data-edit'); render(); }); });
    var e = DRAFT.events.find(function (x) { return x.id === EDIT_ID; });
    if (e) {
      m.querySelectorAll('[data-f]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          var k = inp.getAttribute('data-f');
          e[k] = k === 'stockLeft' ? (inp.value === '' ? 0 : Number(inp.value)) : inp.value;
          markDirty();
        });
        if (inp.tagName === 'SELECT' || inp.type === 'date') inp.addEventListener('change', function () { render(); });
      });
      m.querySelectorAll('.line-row').forEach(function (row) {
        var k = row.getAttribute('data-k'), i = +row.getAttribute('data-i');
        row.querySelectorAll('[data-l]').forEach(function (inp) {
          inp.addEventListener('input', function () {
            var f = inp.getAttribute('data-l');
            e[k][i][f] = f === 'amount' ? (Number(inp.value) || 0) : inp.value;
            markDirty();
          });
        });
      });
      m.querySelectorAll('[data-add]').forEach(function (b) { b.addEventListener('click', function () { var k = b.getAttribute('data-add'); e[k] = e[k] || []; e[k].push(k === 'brandInvestment' ? { label: '', amount: 0 } : { label: '', category: '', amount: 0 }); DIRTY = true; render(); }); });
      m.querySelectorAll('[data-del]').forEach(function (b) { b.addEventListener('click', function () { var p = b.getAttribute('data-del').split(':'); e[p[0]].splice(+p[1], 1); DIRTY = true; render(); }); });
      var del = $('#del-ev');
      if (del) del.addEventListener('click', function () {
        if (del.getAttribute('data-sure')) { DRAFT.events = DRAFT.events.filter(function (x) { return x.id !== e.id; }); EDIT_ID = null; DIRTY = true; render(); }
        else { del.setAttribute('data-sure', '1'); del.textContent = 'Toca de nuevo para eliminar'; }
      });
    }
    $('#new-ev').addEventListener('click', function () {
      var brand = $('#new-brand').value; var d = today(); var iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var id = brand + '-' + Date.now().toString(36);
      DRAFT.events.push({ id: id, brand: brand, date: iso, name: brandOf(brand).name + ' · nueva fecha', venue: '', status: 'planificación', liveEventId: '', notes: '', income: [], costs: [], brandInvestment: [] });
      EDIT_ID = id; DIRTY = true; render();
    });
    $('#discard').addEventListener('click', function () { DRAFT = JSON.parse(JSON.stringify(DATA.finance)); DIRTY = false; render(); });
    var rs = $('#reset-data');
    rs.addEventListener('click', async function () {
      if (!rs.getAttribute('data-sure')) { rs.setAttribute('data-sure', '1'); rs.textContent = 'Toca de nuevo: se borran tus cambios'; return; }
      try { await api({ action: 'reset' }); DIRTY = false; await load(true); toast('Datos de arranque restaurados'); } catch (err) { toast('No se pudo restaurar'); }
    });
    $('#save').addEventListener('click', async function () {
      var btn = this; btn.textContent = 'Guardando…';
      try {
        var r = await api({ action: 'save', finance: DRAFT });
        DATA.finance = JSON.parse(JSON.stringify(DRAFT)); DATA.seeded = false; DIRTY = false;
        render(); toast('Guardado · ' + new Date(r.updatedAt).toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' }));
      } catch (err) { btn.textContent = 'Guardar cambios'; toast(err.message === 'server' ? 'Revisa que cada fecha tenga fecha válida y montos numéricos' : 'No se pudo guardar'); }
    });
  }

  window.addEventListener('beforeunload', function (ev) { if (DIRTY) { ev.preventDefault(); ev.returnValue = ''; } });

  // Sesión guardada en esta pestaña.
  var saved = ss('ceo_pass');
  if (saved) {
    PASS = saved;
    api().then(function (d) { DATA = d; DRAFT = JSON.parse(JSON.stringify(d.finance)); start(); }).catch(function () { ss('ceo_pass', null); });
  }
})();
</script>
</body>
</html>

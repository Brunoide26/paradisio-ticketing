<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Paradisio</title>
<meta name="description" content="Paradisio Club — Latin after disco, after hours. 17 de octubre, Barranco." />

<meta property="og:type" content="website" />
<meta property="og:url" content="https://paradisioclub.com/" />
<meta property="og:title" content="Paradisio" />
<meta property="og:description" content="Ingresa tu código y obtén tu QR." />
<meta property="og:image:alt" content="Paradisio" />
<meta property="og:image" content="https://paradisioclub.com/og-paradisio.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://paradisioclub.com/og-paradisio.png" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="shortcut icon" href="/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#0A0909" />

<link rel="preload" href="/fonts/Jost.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/BodoniModa.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family:'Bodoni Moda'; src:url('/fonts/BodoniModa.woff2') format('woff2'); font-weight:400 900; font-style:normal; font-display:swap; }
  @font-face { font-family:'Bodoni Moda'; src:url('/fonts/BodoniModa-Italic.woff2') format('woff2'); font-weight:400 900; font-style:italic; font-display:swap; }
  @font-face { font-family:'Jost'; src:url('/fonts/Jost.woff2') format('woff2'); font-weight:100 900; font-style:normal; font-display:swap; }
  :root {
    --bg:#000000; --ink:#F4F0EA; --muted:#A9A39A; --faint:#4A4643;
    --red:#E2361F; --line:rgba(244,240,234,0.26);
    --serif:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --sans:'Jost', 'Futura', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; min-height:100vh; min-height:100svh;
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-weight:400; font-size:15px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  a { color:inherit; }
  button, input { font:inherit; }

  /* Etiquetas: sans fino, mayúsculas, muy espaciado -- como el flyer. */
  .pd-cap {
    font-family:var(--sans); font-weight:500; font-size:11px;
    letter-spacing:.3em; text-transform:uppercase; margin:0;
  }
  .pd-cap.is-muted { color:var(--muted); }

  /* ---------- marca ---------- */
  /* Igual que la pantalla de coming soon: logo rojo sobre negro puro. */
  .pd-brand { padding:clamp(40px, 8vh, 72px) 24px 0; text-align:center; }
  .pd-logo { width:min(56vw, 300px); height:auto; display:inline-block; }
  body.is-landing { justify-content:center; }
  body.is-landing .pd-brand { padding-top:0; }
  body.is-landing .pd-logo { width:min(72vw, 620px); }
  body.is-landing main { flex:0; padding-top:clamp(30px, 6vh, 56px); }

  main { flex:1; display:flex; justify-content:center; padding:clamp(36px, 6vh, 64px) 24px 72px; }
  .pd-step { width:100%; max-width:460px; display:none; text-align:center; }
  .pd-step.is-active { display:block; }
  #step-form { max-width:560px; }

  .pd-title {
    font-family:var(--serif); font-weight:500; font-size:clamp(34px, 7vw, 46px);
    line-height:1.08; letter-spacing:-.005em; margin:0;
  }
  .pd-title em { font-style:italic; }
  .pd-title .pd-sub { display:inline-block; font-size:.56em; margin-top:6px; }
  .pd-lead { color:var(--muted); margin:14px auto 0; max-width:400px; font-size:13.5px; line-height:1.45; text-wrap:balance; }

  /* ---------- código ---------- */
  #step-code { max-width:340px; }
  .pd-code-form { margin:0; }
  .pd-code-input {
    width:100%; background:transparent; color:var(--ink); text-align:center;
    border:1px solid rgba(255,255,255,.34); border-radius:0; outline:none;
    font-family:var(--sans); font-weight:300; text-transform:uppercase;
    font-size:15px; letter-spacing:.42em; text-indent:.42em;
    padding:18px 12px; transition:border-color .25s;
  }
  .pd-code-input::placeholder { color:rgba(255,255,255,.34); font-size:11px; letter-spacing:.42em; }
  .pd-code-input:focus { border-color:rgba(255,255,255,.75); }
  .pd-code-input.has-error { border-color:var(--red); }
  #step-code .pd-btn { margin-top:14px; border-color:transparent; color:rgba(255,255,255,.55); font-weight:300; }
  #step-code .pd-btn:hover:not(:disabled) { background:transparent; color:var(--ink); border-color:transparent; }

  /* ---------- botones ---------- */
  .pd-btn {
    appearance:none; display:block; width:100%; margin-top:34px; cursor:pointer;
    background:transparent; color:var(--ink); border:1px solid rgba(244,240,234,.55); border-radius:0;
    font-family:var(--sans); font-weight:500; font-size:12px; letter-spacing:.32em; text-indent:.32em; text-transform:uppercase;
    padding:18px 24px; text-align:center; text-decoration:none;
    transition:background .25s, color .25s, border-color .25s;
  }
  .pd-btn:hover:not(:disabled) { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .pd-btn:focus-visible { outline:1px solid var(--ink); outline-offset:4px; }
  .pd-btn:disabled { opacity:.4; cursor:default; }
  .pd-btn-quiet { border-color:transparent; color:var(--muted); margin-top:6px; }
  .pd-btn-quiet:hover:not(:disabled) { background:transparent; color:var(--ink); border-color:transparent; }
  .pd-link-btn {
    background:none; border:none; padding:0; cursor:pointer; color:var(--muted);
    font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
  }
  .pd-link-btn:hover { color:var(--ink); }

  .pd-msg { min-height:20px; margin:16px 0 0; font-size:13px; color:var(--red); }
  .pd-msg:empty { min-height:0; margin:0; }

  /* ---------- formulario ---------- */
  .pd-code-chip { display:inline-flex; align-items:center; gap:16px; margin-top:22px; }
  .pd-code-chip span { font-weight:500; letter-spacing:.38em; font-size:13px; }
  .pd-code-chip i { width:1px; height:12px; background:var(--faint); display:block; }

  form.pd-fields {
    display:grid; grid-template-columns:1fr 1fr; gap:30px 28px;
    margin-top:46px; text-align:left;
  }
  @media (max-width:520px){ form.pd-fields { grid-template-columns:1fr; gap:26px; } }
  .pd-field { display:flex; flex-direction:column; gap:4px; }
  .pd-field.is-wide { grid-column:1 / -1; }
  .pd-field label { font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  .pd-input {
    width:100%; background:transparent; color:var(--ink);
    border:none; border-bottom:1px solid var(--line); border-radius:0;
    padding:10px 0 9px; font-size:17px; font-weight:400; outline:none;
    transition:border-color .25s; -webkit-appearance:none; appearance:none;
  }
  .pd-input:focus { border-bottom-color:var(--ink); }
  .pd-input.has-error { border-bottom-color:var(--red); }
  .pd-input::placeholder { color:var(--faint); }
  input[type="date"].pd-input { color-scheme:dark; min-height:42px; }
  .pd-prefix { position:relative; }
  .pd-prefix > span { position:absolute; left:0; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .pd-prefix .pd-input { padding-left:16px; }
  .pd-err { font-size:12px; color:var(--red); margin:2px 0 0; }
  .pd-err:empty { display:none; }

  .pd-check { grid-column:1 / -1; display:flex; gap:14px; align-items:flex-start; font-size:14px; color:var(--muted); line-height:1.6; cursor:pointer; }
  .pd-check input {
    appearance:none; -webkit-appearance:none; flex:none; margin:3px 0 0;
    width:15px; height:15px; border:1px solid var(--muted); background:transparent; cursor:pointer; border-radius:0;
  }
  .pd-check input:checked { background:var(--ink); border-color:var(--ink); }
  .pd-check input:checked::after { content:''; display:block; width:4px; height:8px; margin:1px 0 0 4.5px; border:solid var(--bg); border-width:0 1.5px 1.5px 0; transform:rotate(45deg); }
  .pd-check input:focus-visible { outline:1px solid var(--ink); outline-offset:3px; }
  .pd-check a { text-underline-offset:3px; }
  .pd-check a:hover { color:var(--ink); }
  .pd-form-actions { grid-column:1 / -1; text-align:center; }
  .pd-form-actions .pd-btn { margin-top:14px; }

  /* ---------- entrada ---------- */
  .pd-ticket-name { font-family:var(--serif); font-size:clamp(28px, 6vw, 36px); line-height:1.1; margin:14px 0 0; }
  .pd-qr-frame { display:inline-block; margin-top:34px; padding:14px; background:var(--ink); }
  .pd-qr-frame img { display:block; width:236px; height:236px; image-rendering:pixelated; }
  .pd-ticket-code { margin:18px 0 0; font-size:12px; letter-spacing:.38em; text-indent:.38em; color:var(--muted); }
  .pd-validity {
    margin:30px auto 0; padding:16px 0; max-width:320px;
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  }
  .pd-validity .pd-cap + .pd-cap { margin-top:8px; }
  .pd-validity .is-red { color:var(--red); }
  .pd-note { color:var(--muted); font-size:13px; margin:22px auto 0; max-width:330px; }

  /* ---------- footer ---------- */
  footer {
    padding:28px 24px calc(28px + env(safe-area-inset-bottom)); text-align:center;
    color:var(--faint); font-size:10px; letter-spacing:.28em; text-transform:uppercase;
  }
  footer nav { display:flex; justify-content:center; flex-wrap:wrap; gap:8px 26px; margin-bottom:14px; }
  footer a { text-decoration:none; color:var(--muted); }
  footer a:hover { color:var(--ink); }

  @keyframes pd-in { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .pd-step.is-active { animation:pd-in .7s cubic-bezier(.2,.7,.2,1) both; }
  .pd-brand { animation:pd-in 1s cubic-bezier(.2,.7,.2,1) both; }
  @media (prefers-reduced-motion: reduce) { .pd-step.is-active, .pd-brand { animation:none; } }
</style>
</head>
<body class="is-landing">
  <header class="pd-brand">
    <img class="pd-logo" src="/paradisio-logo.png" alt="Paradisio" width="1200" height="388" />
  </header>

  <main>
    <!-- Paso 1: código -->
    <section class="pd-step is-active" id="step-code" aria-label="Ingresa tu código">
      <form class="pd-code-form" id="code-form" novalidate>
        <input class="pd-code-input" id="code-input" name="code" type="text"
               placeholder="Ingresa tu código" aria-label="Ingresa tu código" maxlength="16"
               autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-msg" />
        <p class="pd-msg" id="code-msg" role="alert"></p>
        <button class="pd-btn" type="submit" id="code-btn">Continuar</button>
      </form>
    </section>

    <!-- Paso 2: datos -->
    <section class="pd-step" id="step-form" aria-labelledby="form-title">
      <h2 class="pd-title" id="form-title">After Hours<br><em class="pd-sub">by Jägermeister</em></h2>
      <p class="pd-lead">Completa tus datos tal como figuran en tu documento. Te lo pedirán en la puerta junto con el QR.</p>
      <div class="pd-code-chip">
        <span id="code-chip"></span><i></i>
        <button type="button" class="pd-link-btn" id="change-code-btn">Cambiar</button>
      </div>
      <form class="pd-fields" id="data-form" novalidate>
        <div class="pd-field">
          <label for="f-nombre">Nombre</label>
          <input class="pd-input" id="f-nombre" name="nombre" type="text" autocomplete="given-name" autocapitalize="words" required />
          <p class="pd-err" data-for="f-nombre"></p>
        </div>
        <div class="pd-field">
          <label for="f-apellido">Apellidos</label>
          <input class="pd-input" id="f-apellido" name="apellido" type="text" autocomplete="family-name" autocapitalize="words" required />
          <p class="pd-err" data-for="f-apellido"></p>
        </div>
        <div class="pd-field">
          <label for="f-dni">DNI</label>
          <input class="pd-input" id="f-dni" name="dni" type="text" inputmode="numeric" autocomplete="off" maxlength="12" required />
          <p class="pd-err" data-for="f-dni"></p>
        </div>
        <div class="pd-field">
          <label for="f-dob">Fecha de nacimiento</label>
          <input class="pd-input" id="f-dob" name="dob" type="date" autocomplete="bday" required />
          <p class="pd-err" data-for="f-dob"></p>
        </div>
        <div class="pd-field is-wide">
          <label for="f-email">Correo</label>
          <input class="pd-input" id="f-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required />
          <p class="pd-err" data-for="f-email"></p>
        </div>
        <div class="pd-field">
          <label for="f-phone">Número</label>
          <input class="pd-input" id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required />
          <p class="pd-err" data-for="f-phone"></p>
        </div>
        <div class="pd-field">
          <label for="f-ig">Instagram</label>
          <div class="pd-prefix">
            <span aria-hidden="true">@</span>
            <input class="pd-input" id="f-ig" name="instagram" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required />
          </div>
          <p class="pd-err" data-for="f-ig"></p>
        </div>
        <label class="pd-check">
          <input type="checkbox" id="f-accept" />
          <span>Soy mayor de 18 años y acepto los <a href="/terminos" target="_blank" rel="noopener">Términos</a> y la <a href="/privacidad" target="_blank" rel="noopener">Política de Privacidad</a>.</span>
        </label>
        <div class="pd-form-actions">
          <p class="pd-msg" id="form-msg" role="alert"></p>
          <button class="pd-btn" type="submit" id="form-btn">Generar mi QR</button>
        </div>
      </form>
    </section>

    <!-- Paso 3: QR -->
    <section class="pd-step" id="step-ticket" aria-labelledby="ticket-name">
      <p class="pd-cap" style="color:var(--red);" id="ticket-tier">Invitación</p>
      <p class="pd-ticket-name" id="ticket-name"></p>
      <div class="pd-qr-frame"><img id="ticket-qr" alt="Código QR de tu entrada" width="236" height="236" /></div>
      <p class="pd-ticket-code" id="ticket-code"></p>
      <div class="pd-validity">
        <p class="pd-cap" id="ticket-date"></p>
        <p class="pd-cap"><a id="ticket-address" href="#" target="_blank" rel="noopener" style="text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--faint);"></a></p>
        <p class="pd-cap is-red" id="ticket-validity"></p>
      </div>
      <p class="pd-note" id="ticket-lead">También te lo enviamos por correo. Preséntalo con tu documento de identidad físico. Solo mayores de 18.</p>
      <a class="pd-btn" id="ticket-link" href="#">Ver mi entrada</a>
      <button class="pd-btn pd-btn-quiet" type="button" id="another-btn">Canjear otro código</button>
    </section>
  </main>


<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const steps = ['step-code', 'step-form', 'step-ticket'];
  let currentCode = '';
  let eventInfo = { name: '', dateLabel: '', dateIso: '' };

  function show(id){
    steps.forEach((s) => $(s).classList.toggle('is-active', s === id));
    document.body.classList.toggle('is-landing', id === 'step-code');
    window.scrollTo(0, 0);
  }

  function cleanCode(v){ return String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16); }

  function setEvent(ev){
    if (!ev) return;
    eventInfo = ev;
  }

  /* ---------------- Paso 1 ---------------- */
  const CODE_ERRORS = {
    not_found: 'Ese código no existe. Revisa que esté bien escrito.',
    used: 'Ese código ya fue utilizado.',
    revoked: 'Ese código ya no es válido.',
    expired: 'Ese código ya no es válido.',
  };

  async function submitCode(e){
    if (e) e.preventDefault();
    const code = cleanCode($('code-input').value);
    $('code-input').value = code;
    const msg = $('code-msg');
    if (code.length < 4) {
      msg.textContent = 'Ingresa tu código.';
      $('code-input').classList.add('has-error');
      $('code-input').focus();
      return;
    }
    const btn = $('code-btn');
    btn.disabled = true; btn.textContent = 'Verificando…'; msg.textContent = '';
    try {
      const r = await fetch('/api/invite?code=' + encodeURIComponent(code));
      const d = await r.json();
      setEvent(d.event);
      if (!d.ok) {
        msg.textContent = CODE_ERRORS[d.reason] || 'No pudimos validar el código.';
        $('code-input').classList.add('has-error');
        return;
      }
      currentCode = code;
      $('code-chip').textContent = code;
      show('step-form');
      $('f-nombre').focus({ preventScroll: true });
    } catch (err) {
      msg.textContent = 'Error de conexión. Intenta de nuevo.';
    } finally {
      btn.disabled = false; btn.textContent = 'Continuar';
    }
  }
  $('code-form').addEventListener('submit', submitCode);
  $('code-input').addEventListener('input', () => {
    $('code-input').classList.remove('has-error');
    $('code-msg').textContent = '';
  });
  $('change-code-btn').addEventListener('click', () => {
    show('step-code');
    $('code-input').focus();
    $('code-input').select();
  });

  /* ---------------- Paso 2 ---------------- */
  const NAME_RE = /^[a-zA-ZñÑüÜáéíóúÁÉÍÓÚ' -]{2,}$/;
  const DOC_RE = /^(\d{8}|[a-zA-Z0-9]{8,12})$/;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const IG_RE = /^[a-z0-9._]{1,30}$/;

  function cleanIg(v){
    return String(v || '').trim()
      .replace(/^https?:\/\//i, '').replace(/^(www\.)?instagram\.com\//i, '')
      .split(/[/?#]/)[0].replace(/^@+/, '').toLowerCase();
  }

  function ageAsOf(dobStr, asOf){
    const dob = new Date(dobStr + 'T00:00:00');
    if (isNaN(dob.getTime())) return null;
    let age = asOf.getFullYear() - dob.getFullYear();
    const m = asOf.getMonth() - dob.getMonth();
    if (m < 0 || (m === 0 && asOf.getDate() < dob.getDate())) age--;
    return age;
  }

  function readForm(){
    return {
      nombre: $('f-nombre').value.trim(),
      apellido: $('f-apellido').value.trim(),
      dni: $('f-dni').value.trim().toUpperCase(),
      dob: $('f-dob').value,
      email: $('f-email').value.trim().toLowerCase(),
      phone: $('f-phone').value.trim(),
      instagram: cleanIg($('f-ig').value),
      accepted: $('f-accept').checked,
    };
  }

  function validateField(id, d){
    switch (id) {
      case 'f-nombre': return !d.nombre ? 'Requerido.' : (!NAME_RE.test(d.nombre) ? 'Solo letras.' : '');
      case 'f-apellido': return !d.apellido ? 'Requerido.' : (!NAME_RE.test(d.apellido) ? 'Solo letras.' : '');
      case 'f-dni': return !d.dni ? 'Requerido.' : (!DOC_RE.test(d.dni) ? 'DNI de 8 dígitos (o CE / pasaporte).' : '');
      case 'f-dob': {
        if (!d.dob) return 'Requerido.';
        const asOf = eventInfo.dateIso ? new Date(eventInfo.dateIso + 'T00:00:00') : new Date();
        const age = ageAsOf(d.dob, asOf);
        if (age === null || age > 100) return 'Fecha inválida.';
        if (age < 18) return 'Tienes que ser mayor de 18.';
        return '';
      }
      case 'f-email': return !d.email ? 'Requerido.' : (!EMAIL_RE.test(d.email) ? 'Correo inválido.' : '');
      case 'f-phone': {
        const digits = d.phone.replace(/\D/g, '');
        return !digits ? 'Requerido.' : ((digits.length < 7 || digits.length > 15) ? 'Número inválido.' : '');
      }
      case 'f-ig': return !d.instagram ? 'Requerido.' : (!IG_RE.test(d.instagram) ? 'Usuario inválido.' : '');
    }
    return '';
  }

  function setErr(id, msg){
    $(id).classList.toggle('has-error', !!msg);
    const el = document.querySelector('.pd-err[data-for="' + id + '"]');
    if (el) el.textContent = msg || '';
  }

  const FIELD_IDS = ['f-nombre', 'f-apellido', 'f-dni', 'f-dob', 'f-email', 'f-phone', 'f-ig'];
  FIELD_IDS.forEach((id) => {
    $(id).addEventListener('blur', () => { if ($(id).value) setErr(id, validateField(id, readForm())); });
    $(id).addEventListener('input', () => setErr(id, ''));
  });

  const SERVER_ERRORS = {
    missing_fields: 'Completa todos los campos.',
    not_accepted: 'Marca la casilla para continuar.',
    invalid_name: 'Revisa tu nombre y apellidos.',
    invalid_document: 'Revisa tu DNI.',
    invalid_phone: 'Revisa tu número.',
    invalid_instagram: 'Revisa tu usuario de Instagram.',
    invalid_dob: 'Revisa tu fecha de nacimiento.',
    underage: 'El evento es solo para mayores de 18.',
    invalid_email: 'Ese correo no es válido o no recibe mensajes. Usa otro.',
    code_not_found: 'Ese código no existe.',
    code_used: 'Ese código ya fue utilizado.',
    code_revoked: 'Ese código ya no es válido.',
  };

  $('data-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const d = readForm();
    let firstBad = null;
    FIELD_IDS.forEach((id) => {
      const m = validateField(id, d);
      setErr(id, m);
      if (m && !firstBad) firstBad = id;
    });
    const msg = $('form-msg');
    if (firstBad) { msg.textContent = 'Revisa los campos marcados.'; $(firstBad).focus(); return; }
    if (!d.accepted) { msg.textContent = 'Marca la casilla para continuar.'; $('f-accept').focus(); return; }

    const btn = $('form-btn');
    btn.disabled = true; btn.textContent = 'Generando…'; msg.textContent = '';
    try {
      const r = await fetch('/api/redeem', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ code: currentCode }, d)),
      });
      const res = await r.json();
      if (!r.ok) {
        if (res.error === 'already_has_ticket') {
          msg.textContent = res.field === 'email'
            ? 'Ese correo ya tiene una entrada. Revisa tu bandeja.'
            : 'Ese DNI ya tiene una entrada. Revisa el correo con el que te registraste.';
        } else {
          msg.textContent = SERVER_ERRORS[res.error] || 'Algo salió mal. Intenta de nuevo.';
        }
        if (res.error === 'invalid_email') setErr('f-email', 'Usa otro correo.');
        return;
      }
      renderTicket(res, d.email);
    } catch (err) {
      msg.textContent = 'Error de conexión. Intenta de nuevo.';
    } finally {
      btn.disabled = false; btn.textContent = 'Generar mi QR';
    }
  });

  /* ---------------- Paso 3 ---------------- */
  function renderTicket(res, email){
    const t = res.ticket;
    const ev = res.event || eventInfo;
    $('ticket-tier').textContent = t.tierLabel || 'Invitación';
    $('ticket-name').textContent = t.name;
    $('ticket-qr').src = res.qr;
    $('ticket-code').textContent = t.id;
    $('ticket-date').textContent = ev.dateLabel || '';
    $('ticket-address').textContent = ev.address || '';
    $('ticket-address').href = ev.mapsUrl || '#';
    $('ticket-address').parentNode.style.display = ev.address ? '' : 'none';
    $('ticket-validity').textContent = t.validityLabel ? 'QR válido ' + t.validityLabel : '';
    $('ticket-validity').style.display = t.validityLabel ? '' : 'none';
    $('ticket-lead').textContent = (res.emailSent === false
      ? 'No pudimos enviarlo a tu correo ahora. Toma una captura de esta pantalla y guarda el link de "Ver mi entrada".'
      : 'También te lo enviamos a ' + email + '.') + ' Preséntalo con tu documento de identidad físico. Solo mayores de 18.';
    $('ticket-link').href = '/entrada?t=' + encodeURIComponent(t.token);
    show('step-ticket');
  }

  $('another-btn').addEventListener('click', () => {
    $('data-form').reset();
    FIELD_IDS.forEach((id) => setErr(id, ''));
    $('form-msg').textContent = '';
    $('code-input').value = '';
    currentCode = '';
    try { history.replaceState(null, '', '/'); } catch (e) {}
    show('step-code');
    $('code-input').focus();
  });

  /* ---------------- Arranque ---------------- */
  // Link directo del promotor: paradisioclub.com/?c=CODIGO valida y salta al formulario.
  const params = new URLSearchParams(location.search);
  const preset = cleanCode(params.get('c') || params.get('code'));
  if (preset) {
    $('code-input').value = preset;
    submitCode();
  } else {
    fetch('/api/invite?code=').then((r) => r.json()).then((d) => setEvent(d.event)).catch(() => {});
    $('code-input').focus({ preventScroll: true });
  }
})();
</script>
</body>
</html>
